<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alcanfest</title>
    <meta
      name="description"
      content="Alcanfest, el festival urbano más grande de San Martín. Arte, deporte y cultura urbana en Tarapoto."
    />
    <link rel="canonical" href="https://www.alcanfest.com/" />

    <!-- Íconos: favicon.ico para navegadores y buscadores, PNG para pestañas en alta densidad,
         apple-touch-icon para "Agregar a inicio" en iPhone. Se generan con Pillow desde logo-header. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#000000" />

    <!-- Vista previa al compartir (WhatsApp, Facebook, Instagram, LinkedIn, Telegram, iMessage…).
         Las URLs deben ser absolutas. Si se cambia la imagen, cambiar también el nombre del archivo:
         las redes guardan en caché la vista previa por URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alcanfest" />
    <meta property="og:locale" content="es_PE" />
    <meta property="og:url" content="https://www.alcanfest.com/" />
    <meta property="og:title" content="Alcanfest" />
    <meta
      property="og:description"
      content="El festival urbano más grande de San Martín. Arte, deporte y cultura urbana en Tarapoto."
    />
    <meta property="og:image" content="https://www.alcanfest.com/og-2026.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Logo de Alcanfest sobre una foto del público del festival. 13 de diciembre, Tarapoto."
    />

    <!-- X/Twitter: usa las og:* para lo que no esté aquí. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alcanfest" />
    <meta
      name="twitter:description"
      content="El festival urbano más grande de San Martín. Arte, deporte y cultura urbana en Tarapoto."
    />
    <meta name="twitter:image" content="https://www.alcanfest.com/og-2026.jpg" />
    <meta
      name="twitter:image:alt"
      content="Logo de Alcanfest sobre una foto del público del festival. 13 de diciembre, Tarapoto."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800;900&family=Figtree:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
